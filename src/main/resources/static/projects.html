<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker - Projects</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <h1>Task Tracker</h1>
    <a href="index.html" id="logoutLink">Logout</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Create New Project</h2>
        <form id="createProjectForm">
            <input type="text" id="projectName" placeholder="Project Name" required minlength="3" maxlength="50">
            <textarea id="projectDescription" placeholder="Description"></textarea>
            <button type="submit">Create Project</button>
        </form>
        <p id="createProjectMessage"></p>
    </div>

    <div class="card">
        <h2>Your Projects</h2>
        <div id="projectsList" class="list"></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
